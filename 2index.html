<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conscientização e Combate ao Cyberbullying - Ambiente Escolar</title>
    <style>
        /* CSS: Estilização em Tons de Roxo e Acessibilidade */
        :root {
            --bg-color: #f4f0f8;
            --text-color: #2b1f3d;
            --primary-purple: #4a154b;
            --secondary-purple: #6b2d5c;
            --accent-purple: #8a3b8f;
            --light-purple: #f0e6f7;
            --card-bg: #ffffff;
            --warning-purple: #320a36;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 100%;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        /* Barra de Acessibilidade */
        .accessibility-bar {
            background-color: var(--primary-purple);
            color: #ffffff;
            padding: 0.6rem 1rem;
            text-align: right;
            border-bottom: 2px solid var(--accent-purple);
        }

        .accessibility-bar span {
            margin-right: 0.5rem;
            font-weight: bold;
        }

        .accessibility-bar button {
            background-color: var(--secondary-purple);
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 0.3rem 0.7rem;
            margin-left: 0.3rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .accessibility-bar button:focus,
        .accessibility-bar button:hover {
            background-color: var(--accent-purple);
            outline: 2px solid #ffffff;
        }

        /* Cabeçalho */
        header {
            background: linear-gradient(135deg, var(--primary-purple), var(--secondary-purple));
            color: #ffffff;
            padding: 2.5rem 1rem;
            text-align: center;
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.2rem;
        }

        header p {
            font-size: 1.1rem;
            margin: 0;
            opacity: 0.9;
        }

        /* Conteúdo Principal */
        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        section {
            background: var(--card-bg);
            padding: 1.8rem;
            margin-bottom: 1.8rem;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(74, 21, 75, 0.08);
            border-top: 4px solid var(--accent-purple);
